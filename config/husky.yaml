# ============================================================
# 模型与仿真
# ============================================================
model:
  xml_path: "./model/husky.xml"
  timestep: 0.001

sim:
  duration: 30.0        # 仿真总时长 [s]
  realtime: true        # 是否实时同步

# ============================================================
# Husky 运动学参数（从 MJCF 自动提取）
# 此处仅作交叉校验参考值，设为 null 则跳过校验
# ============================================================
husky_check:
  wheel_radius: 0.1651
  half_track:   0.2854
  wheel_base:   0.512

# ============================================================
# 参考轨迹
# type 可选: circle | line | lemniscate | sine
# 切换轨迹只需改 type，对应段参数生效，其余段忽略
# ============================================================
reference:
  type: "line"          # <-- 在这里切换轨迹

  circle:
    radius: 4.0           # R_path [m]
    omega:  0.3           # 角速度 [rad/s]

  line:
    speed: 1.0            # 前进速度 [m/s]
    start: [0.0, 0.0]     # 起点 [m]
    yaw: 0.00         # 朝向 [rad]
    T_vis: 30.0           # 可视化长度对应的时长 [s]

  lemniscate:
    a: 4.0                # 特征尺寸 [m]（x 向幅值，y 向幅值为 a/2）
    omega: 0.3            # [rad/s]

  sine:
    speed: 1            # 沿 x 前进速度 [m/s]
    amplitude: 1.0        # 横向幅值 [m]
    wavelength: 6.0       # 波长 [m]
    start: [0.0, 0.0]
    T_vis: 30.0

# ============================================================
# 零空间避障参数
# ============================================================
avoidance:
  robot_body: "base_link"   # 机器人根 body 名（子树 geom 全部排除）
  robot_radius: 0.6
  distmax: 3.0              # 障碍探测截断距离 [m]
  safe_d: 0.5               # 期望保持的表面距离 [m]
  k_p: 0.1                  # Khatib 逆距离势场增益（g(safe_d) = k_p/safe_d³ [m/s]） 
  kappa: 0.5
  k_theta: 30.0      # 转向通道增益（> k_d，快速对准切向）
  d_min: 0.05               # d 数值下限 [m]，防 1/d³ 发散
  side_judge: rotation        # "target"   = 目标方向最小夹角判决（向量判决，偏向目标侧绕行）
                            # "rotation" = 最小转角判决（基于当前航向 θ，论文原版）
  

# ============================================================
# 级联控制器
# ============================================================
position_loop:          # 位置环
  K_R1: 1.0
  K_R2: 4.0
  P1:   0.5
  P2:   2.0

attitude_loop:          # 姿态环（前馈 + 双幂次反馈）
  K_A0: 10.0
  K_A1: 20.0
  K_A2: 30.0

command_limits:         # 指令限幅
  v_max: 5.0            # [m/s]
  w_max: 30.0           # [rad/s]

# ============================================================
# FTDSO 观测器
# ============================================================
ftdso:
  K_o1: 30.0
  K_o2: 20.0
  p_o1: 1.0
  p_o2: 1.2




# ============================================================
# 初态
# ============================================================
init_state:
  x: 0.0
  y: 0.0
  z_offset: 0.001       # 相对标称高度的偏移
  settle_steps: 2000    # 落地稳定步数
